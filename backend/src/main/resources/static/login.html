<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – Hostel Management System</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="login-page">
    <div class="login-card">
        <div class="login-logo">
            <div class="icon">🏠</div>
            <h1>Hostel Management</h1>
            <p>Warden Portal – Secure Login</p>
        </div>

        <div id="loginAlert" class="alert alert-danger" style="display:none"></div>

        <form id="loginForm" novalidate>
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" class="form-control" placeholder="Enter your username" autocomplete="username" required>
                <div class="error-message" id="usernameError"></div>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" class="form-control" placeholder="Enter your password" autocomplete="current-password" required>
                <div class="error-message" id="passwordError"></div>
            </div>
            <button type="submit" class="btn btn-primary btn-full" id="loginBtn">
                <span id="loginBtnText">🔐 Sign In</span>
            </button>
        </form>

        <p style="text-align:center; margin-top:20px; font-size:13px; color:#999;">
            Default credentials: <strong>warden / warden123</strong>
        </p>
    </div>
</div>

<script src="/js/app.js"></script>
<script>
    Auth.redirectIfLoggedIn();

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const alert = document.getElementById('loginAlert');
        const btn = document.getElementById('loginBtn');

        // Clear errors
        alert.style.display = 'none';
        document.getElementById('usernameError').textContent = '';
        document.getElementById('passwordError').textContent = '';

        if (!username) { document.getElementById('usernameError').textContent = 'Username is required'; return; }
        if (!password) { document.getElementById('passwordError').textContent = 'Password is required'; return; }

        btn.disabled = true;
        btn.innerHTML = '<div class="spinner" style="width:18px;height:18px;border-width:2px"></div>';

        try {
            const data = await API.post('/auth/login', { username, password });
            Auth.setSession(data);
            window.location.href = '/dashboard.html';
        } catch (err) {
            alert.textContent = '⚠️ ' + err.message;
            alert.style.display = 'flex';
            btn.disabled = false;
            btn.innerHTML = '🔐 Sign In';
        }
    });
</script>
</body>
</html>
