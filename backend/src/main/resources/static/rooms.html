<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Rooms – Hostel Management</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app-layout">
    <aside class="sidebar">
        <div class="sidebar-header">
            <span class="logo-icon">🏠</span>
            <div class="logo-text"><h2>Hostel Mgmt</h2><span>Warden Portal</span></div>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-section-title">Main Menu</div>
            <a href="/dashboard.html" class="nav-link" data-page="dashboard"><span class="nav-icon">📊</span> Dashboard</a>
            <a href="/attendance.html" class="nav-link" data-page="attendance"><span class="nav-icon">✅</span> Attendance</a>
            <a href="/students.html" class="nav-link" data-page="students"><span class="nav-icon">👨‍🎓</span> Students</a>
            <a href="/fees.html" class="nav-link" data-page="fees"><span class="nav-icon">💰</span> Fee Tracking</a>
            <a href="/complaints.html" class="nav-link" data-page="complaints"><span class="nav-icon">📋</span> Complaints</a>
            <div class="nav-section-title">Settings</div>
            <a href="/rooms.html" class="nav-link" data-page="rooms"><span class="nav-icon">🚪</span> Manage Rooms</a>
        </nav>
        <div class="sidebar-footer">
            <div class="user-info">
                <div class="user-avatar" id="sidebarUserInitial">W</div>
                <div class="user-details">
                    <div class="user-name" id="sidebarUserName">Warden</div>
                    <div class="user-role" id="sidebarUserRole">WARDEN</div>
                </div>
            </div>
            <button class="btn-logout" onclick="logout()">🚪 Logout</button>
        </div>
    </aside>

    <div class="main-content">
        <div class="topbar">
            <h1>🚪 Manage Rooms</h1>
            <div class="topbar-actions">
                <button class="btn btn-primary" onclick="openAddRoomModal()">+ Add Room</button>
            </div>
        </div>
        <div class="page-content">
            <div class="alert alert-warning">
                ℹ️ Rooms are scalable. Add as many rooms as needed. Default capacity is 3 students per room.
            </div>
            <div class="card" style="margin-top:16px">
                <div class="card-header">
                    <h3>Room List</h3>
                    <span id="roomCount" style="font-size:13px;color:var(--text-secondary)"></span>
                </div>
                <div class="card-body">
                    <div class="table-container" id="roomsTable">
                        <div class="loading"><div class="spinner"></div></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Add/Edit Room Modal -->
<div class="modal-overlay" id="roomModal">
    <div class="modal">
        <div class="modal-header">
            <h3 id="roomModalTitle">Add Room</h3>
            <button class="modal-close" onclick="Modal.close('roomModal')">×</button>
        </div>
        <div class="modal-body">
            <div class="form-row">
                <div class="form-group">
                    <label>Room Number *</label>
                    <input type="text" id="fRoomNumber" class="form-control" placeholder="e.g. 101 or A-01">
                </div>
                <div class="form-group">
                    <label>Floor</label>
                    <input type="number" id="fRoomFloor" class="form-control" value="1" min="0" max="20">
                </div>
            </div>
            <div class="form-group">
                <label>Capacity (max students)</label>
                <input type="number" id="fRoomCapacity" class="form-control" value="3" min="1" max="10">
            </div>
            <div class="alert alert-danger" id="roomModalError" style="display:none"></div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-outline" onclick="Modal.close('roomModal')">Cancel</button>
            <button class="btn btn-primary" id="roomSaveBtn" onclick="saveRoom()">Save Room</button>
        </div>
    </div>
</div>

<script src="/js/app.js"></script>
<script>
Auth.requireAuth();
initSidebar('rooms');

let allRooms = [];
let editingRoomId = null;

function escHtml(s) { if(!s)return''; return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

async function loadRooms() {
    try {
        allRooms = await API.get('/rooms');
        document.getElementById('roomCount').textContent = `${allRooms.length} rooms`;
        renderTable();
    } catch (err) { Toast.error(err.message); }
}

function renderTable() {
    const el = document.getElementById('roomsTable');
    if (allRooms.length === 0) {
        el.innerHTML = '<div class="empty-state"><div class="empty-icon">🚪</div><p>No rooms found. Add your first room!</p></div>';
        return;
    }
    el.innerHTML = `<table>
        <thead><tr>
            <th>Room No.</th><th>Floor</th><th>Capacity</th><th>Occupied</th><th>Availability</th><th>Actions</th>
        </tr></thead>
        <tbody>
        ${allRooms.map(r => {
            const pct = Math.round((r.currentOccupancy / r.capacity) * 100);
            const avail = r.capacity - r.currentOccupancy;
            return `<tr>
                <td><strong>Room ${escHtml(r.roomNumber)}</strong></td>
                <td>Floor ${r.floor}</td>
                <td>${r.capacity}</td>
                <td>${r.currentOccupancy}</td>
                <td style="min-width:140px">
                    <div style="font-size:13px;margin-bottom:4px">
                        ${avail > 0 ? `<span style="color:var(--success)">${avail} bed(s) free</span>` :
                                       '<span style="color:var(--danger)">Full</span>'}
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width:${pct}%; background:${pct >= 100 ? 'var(--danger)' : pct >= 66 ? 'var(--warning)' : 'var(--success)'}"></div>
                    </div>
                </td>
                <td>
                    <button class="btn btn-sm btn-primary" onclick="editRoom(${r.id})">✏ Edit</button>
                    <button class="btn btn-sm btn-danger" onclick="deleteRoom(${r.id}, '${escHtml(r.roomNumber)}')">🗑</button>
                </td>
            </tr>`;
        }).join('')}
        </tbody>
    </table>`;
}

function openAddRoomModal() {
    editingRoomId = null;
    document.getElementById('roomModalTitle').textContent = 'Add Room';
    document.getElementById('fRoomNumber').value = '';
    document.getElementById('fRoomFloor').value = 1;
    document.getElementById('fRoomCapacity').value = 3;
    document.getElementById('roomModalError').style.display = 'none';
    Modal.open('roomModal');
}

function editRoom(id) {
    const r = allRooms.find(x => x.id === id);
    if (!r) return;
    editingRoomId = id;
    document.getElementById('roomModalTitle').textContent = 'Edit Room';
    document.getElementById('fRoomNumber').value = r.roomNumber;
    document.getElementById('fRoomFloor').value = r.floor;
    document.getElementById('fRoomCapacity').value = r.capacity;
    document.getElementById('roomModalError').style.display = 'none';
    Modal.open('roomModal');
}

async function saveRoom() {
    const errEl = document.getElementById('roomModalError');
    errEl.style.display = 'none';
    const body = {
        roomNumber: document.getElementById('fRoomNumber').value.trim(),
        floor: parseInt(document.getElementById('fRoomFloor').value),
        capacity: parseInt(document.getElementById('fRoomCapacity').value)
    };
    if (!body.roomNumber) { errEl.textContent = 'Room number is required.'; errEl.style.display='flex'; return; }
    const btn = document.getElementById('roomSaveBtn');
    btn.disabled = true;
    try {
        if (editingRoomId) { await API.put(`/rooms/${editingRoomId}`, body); Toast.success('Room updated'); }
        else { await API.post('/rooms', body); Toast.success('Room added'); }
        Modal.close('roomModal');
        await loadRooms();
    } catch (err) {
        errEl.textContent = err.message;
        errEl.style.display = 'flex';
    } finally { btn.disabled = false; }
}

async function deleteRoom(id, num) {
    if (!confirm(`Delete Room ${num}? All student assignments will need to be updated.`)) return;
    try {
        await API.delete(`/rooms/${id}`);
        Toast.success('Room deleted');
        await loadRooms();
    } catch (err) { Toast.error(err.message); }
}

loadRooms();
</script>
</body>
</html>
